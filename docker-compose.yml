# ============================================================
# NEXUS — Unified Docker Compose Stack
# ============================================================
# Services:
#   1. db        — PostgreSQL 15 + PostGIS 3.3
#   2. backend   — Unified FastAPI Engine (Port 8000)
#   3. frontend  — Unified Next.js Platform (Port 3000)
#   4. seeder    — Database seed script (run on-demand)
# ============================================================

services:
  # ── Tier 1: PostGIS Database ─────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: nexus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexusdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexusdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  # ── Tier 2: Unified Backend (FastAPI) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@db:5432/${POSTGRES_DB:-nexusdb}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@db:5432/${POSTGRES_DB:-nexusdb}
      CONSENT_HASH_SALT: ${CONSENT_HASH_SALT:-nexus-secret-salt-2026}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus-net

  # ── Tier 3: Unified Frontend (Next.js) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GEMINI_AVAILABLE: ${NEXT_PUBLIC_GEMINI_AVAILABLE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nexus-net

  # ── Database Seeder Profile ──────────────────────────────
  seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_seeder
    profiles:
      - seed
    environment:
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@db:5432/${POSTGRES_DB:-nexusdb}
    entrypoint: ["python", "-m", "backend.seed.seed_data"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus-net

volumes:
  pgdata:

networks:
  nexus-net:
    driver: bridge
